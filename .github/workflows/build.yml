name: Build

# Builds Baribounce on every push and pull request, and attaches the jar to published releases.
# The upstream CCBlueX publishing steps (their Maven, their build API, their Script API repo)
# were removed, since they need CCBlueX's own secrets.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read JDK version
        id: versions
        run: echo "jdk=$(sed -n 's/^jdk[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        env:
          CI: true
        run: ./gradlew build

      - name: Find the mod jar
        id: jar
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -regex '.*/baribounce-[0-9.]*\.jar' | head -n1)
          if [ -z "$JAR" ]; then
            echo "[ERROR] built jar not found in build/libs" >&2
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      # Baritone is a separate, optional mod and not part of the Baribounce jar,
      # so it is shipped next to it (LGPL-3.0, see libs/README.md)
      - name: Upload jars as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: baribounce
          path: |
            ${{ steps.jar.outputs.path }}
            libs/baritone-fabric-1.20.0.jar

      - name: Attach jars to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.jar.outputs.path }}" libs/baritone-fabric-1.20.0.jar --clobber
